services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: choose_course
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d choose_course"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/choose_course
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 8080
      APP_DEMO_SEED: "true"
      APP_DEMO_LOGIN: "true"
      APP_MAX_CREDITS: ${APP_MAX_CREDITS:-30}
      APP_CREDIT_GOAL: ${APP_CREDIT_GOAL:-20}
      APP_PAGE_SIZE: ${APP_PAGE_SIZE:-20}
    ports:
      - "8080:8080"

volumes:
  pgdata:
