<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>学生管理 · 选课系统</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container">
    <h1>学生管理</h1>
    <p class="subtitle">新增、编辑、删除学生；页面不显示密码。</p>

    <div class="alert ok" th:if="${message}" th:text="${message}"></div>
    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="toolbar">
        <form class="search-form" th:action="@{/admin/students}" method="get">
            <input type="search" name="q" th:value="${q}" placeholder="学号 / 姓名 / 专业 / 年级">
            <button type="submit">搜索</button>
            <a class="button" th:href="@{/admin/students}">重置</a>
        </form>
        <a class="button primary" th:href="@{/admin/students/new}">新增学生</a>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>学号</th>
                <th>姓名</th>
                <th>年级</th>
                <th>专业</th>
                <th>学院</th>
                <th>密保手机</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${students}">
                <td th:text="${s.sno}">sno</td>
                <td th:text="${s.name}">姓名</td>
                <td th:text="${s.grade}">年级</td>
                <td th:text="${s.major}">专业</td>
                <td th:text="${s.college}">学院</td>
                <td th:text="${s.phone}">手机</td>
                <td>
                    <div class="actions">
                        <a th:href="@{/admin/students/{sno}/edit(sno=${s.sno})}">编辑</a>
                        <a th:href="@{/admin/students/{sno}/courses(sno=${s.sno})}">已选课程</a>
                        <form th:action="@{/admin/students/{sno}/delete(sno=${s.sno})}"
                              method="post" class="inline-form"
                              onsubmit="return confirm('确定删除该学生？其选课记录也会一并删除。');">
                            <button type="submit" class="link-button-inline danger">删除</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(students)}">
                <td colspan="7" class="empty-cell">没有匹配的学生。</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
