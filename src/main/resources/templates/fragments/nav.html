<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="nav" th:fragment="nav">
    <a class="brand" th:href="@{/}">选课系统</a>
    <div class="nav-links">
        <a sec:authorize="hasRole('STUDENT')" th:href="@{/student/courses}">选课</a>
        <a sec:authorize="hasRole('STUDENT')" th:href="@{/student/schedule}">课表</a>
        <a sec:authorize="hasRole('STUDENT')" th:href="@{/student/profile}">个人信息</a>
        <a sec:authorize="hasRole('STUDENT')" th:href="@{/student/password}">修改密码</a>
        <a sec:authorize="hasRole('STUDENT')" th:href="@{/student/phone}">密保手机</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/courses}">课程管理</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/students}">学生管理</a>
    </div>
    <div class="nav-user" sec:authorize="isAuthenticated()">
        <span th:text="${#authentication.name}">user</span>
        <form th:action="@{/logout}" method="post" class="inline-form">
            <button type="submit" class="link-button">退出</button>
        </form>
    </div>
</nav>
</body>
</html>
