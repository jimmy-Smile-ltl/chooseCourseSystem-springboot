<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>修改密码 · 选课系统</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container">
    <h1>修改密码</h1>
    <p class="subtitle">修改成功后当前登录状态仍然有效。</p>

    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/student/password}" method="post" class="form-card">
        <div class="form-grid">
            <label>
                原密码
                <input type="password" name="oldPassword" required autocomplete="current-password">
            </label>
            <label>
                新密码
                <input type="password" name="newPassword" required minlength="4" autocomplete="new-password">
            </label>
            <label>
                确认新密码
                <input type="password" name="confirmPassword" required minlength="4" autocomplete="new-password">
            </label>
        </div>
        <div class="form-actions">
            <button type="submit" class="primary">保存新密码</button>
            <a class="button" th:href="@{/student/profile}">取消</a>
        </div>
    </form>
</main>
</body>
</html>
