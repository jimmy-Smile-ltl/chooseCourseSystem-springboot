<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>个人信息 · 选课系统</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container">
    <h1>个人信息</h1>
    <div class="alert ok" th:if="${message}" th:text="${message}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <div class="card profile-grid">
        <div><span class="label">学号</span><span th:text="${student.sno}">-</span></div>
        <div><span class="label">姓名</span><span th:text="${student.name}">-</span></div>
        <div><span class="label">年级</span><span th:text="${student.grade}">-</span></div>
        <div><span class="label">专业</span><span th:text="${student.major}">-</span></div>
        <div><span class="label">学院</span><span th:text="${student.college}">-</span></div>
        <div><span class="label">密保手机</span><span th:text="${student.phone}">-</span></div>
    </div>
    <p class="hint">
        密码不会在页面上显示。
        <a th:href="@{/student/password}">修改密码</a>
        ·
        <a th:href="@{/student/phone}">修改密保手机</a>
    </p>
</main>
</body>
</html>
