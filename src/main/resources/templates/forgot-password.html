<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>忘记密码 · 选课系统</title>
    <link rel="shortcut icon" th:href="@{/image/logo.png}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/forgetPW.css}">
    <link rel="stylesheet" th:href="@{/live2d/waifu.css}">
    <link rel="stylesheet" th:href="@{/css/fx.css}">
</head>
<body class="forget-page">

<main class="forget-body">
    <div class="forget-head">
        <a class="back-link" th:href="@{/login}">← 返回登录</a>
    </div>
    <div class="forgettop">忘记密码</div>
    <p class="forget-subtitle">验证账号与密保手机后重置密码</p>

    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/forgot-password}" method="post" class="forget-form">
        <div class="choice">
            <label>
                <input type="radio" name="who" value="student"
                       th:checked="${who == null or who == 'student'}">
                <span>学生</span>
            </label>
            <label>
                <input type="radio" name="who" value="admin"
                       th:checked="${who == 'admin'}">
                <span>管理员</span>
            </label>
        </div>
        <div class="tr">
            <span>账号</span>
            <input type="text" name="id" th:value="${id}" required placeholder="学号 / 管理员 ID">
        </div>
        <div class="tr">
            <span>密保手机</span>
            <input type="text" name="phone" th:value="${phone}" required placeholder="账号绑定的手机号">
        </div>
        <div class="tr">
            <span>新密码</span>
            <input type="password" name="newPassword" required minlength="4"
                   autocomplete="new-password" placeholder="至少 4 位">
        </div>
        <div class="tr">
            <span>确认密码</span>
            <input type="password" name="confirmPassword" required minlength="4"
                   autocomplete="new-password" placeholder="再次输入新密码">
        </div>
        <div class="tr">
            <span>验证码</span>
            <div class="captcha-row">
                <input type="text" name="captcha" maxlength="4" autocomplete="off"
                       required placeholder="4 位验证码">
                <div class="captcha-side">
                    <img id="captchaImg" class="captcha-img" th:src="@{/captcha}"
                         alt="验证码" title="点击刷新" onclick="refreshCaptcha()">
                    <button type="button" class="captcha-refresh"
                            onclick="refreshCaptcha()">换一张</button>
                </div>
            </div>
        </div>
        <p class="field-hint">验证码是右侧图形验证码，不是短信验证码；看不清可以点“换一张”。</p>
        <button id="submit" type="submit">重置密码</button>
    </form>
</main>

<div class="contact">
    遇到问题？<a th:href="@{/help}">查看帮助</a>
    ·
    <a th:href="@{/login}">返回登录</a>
</div>

<script>
    function refreshCaptcha() {
        var img = document.getElementById('captchaImg');
        if (img) {
            img.src = '/captcha?t=' + Date.now();
        }
    }
</script>
<script th:src="@{/live2d/live2d.min.js}"></script>
<script th:src="@{/live2d/waifu-tips.js}"></script>
<script>
    (function () {
        if (window.innerWidth < 768 || typeof window.initWidget !== 'function') {
            return;
        }
        window.initWidget({
            waifuPath: '/live2d/waifu-tips.json',
            cdnPath: 'https://cdn.jsdelivr.net/gh/alink/live2d-widget@master/',
            tools: ['switch-model', 'switch-texture', 'photo', 'info', 'quit']
        });
        setTimeout(function () {
            var toggle = document.getElementById('waifu-toggle');
            if (toggle) {
                toggle.click();
            }
        }, 900);
    })();
</script>
<script th:src="@{/js/fx.js}"></script>
</body>
</html>
